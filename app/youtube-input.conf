# rp5deck's own mpv input.conf for the YouTube window (rp5deck-yt), owner
# request 2 (test day, 24 Sep): "tapping the video should pause it."
#
# Shipped with rp5deck and passed with --input-conf (never the owner's own
# ~/.config/mpv/input.conf - youtube.py also passes --no-config and
# --input-default-bindings=no, so THIS file is the only source of bindings).
#
# One binding only: a tap/click pauses. No MBTN_LEFT_DBL line is bound to
# `cycle fullscreen` (mpv's normal default) or anything else - a fullscreen
# mpv is drawn above rp5deck's own layer-shell strip and would hide it
# (see youtube.py's build_command), so double-tap fullscreen must stay off.
# A double tap here just cycles pause twice (back to where it started).
MBTN_LEFT cycle pause
MBTN_LEFT_DBL ignore
